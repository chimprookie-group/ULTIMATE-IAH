name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Arch Linux)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git qt6-base qt6-declarative qt6-webengine \
            qt6-webchannel qt6-wayland qt6-svg hicolor-icon-theme \
            xdg-desktop-portal xdg-utils polkit nodejs npm python \
            python-yaml github-cli
      - name: Build
        run: ./bin/build
      - name: Test
        run: ./bin/test
